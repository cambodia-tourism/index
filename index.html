<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ដើរលេងកម្ពុជា - ស្វែងរករមណីយដ្ឋាន ប្រាសាទ និងភោជនីយដ្ឋាន</title>
    
    <!-- Google Fonts: Kantumruy Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet Free Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        #map { height: 420px; width: 100%; border-radius: 1rem; z-index: 1; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-teal-600 to-emerald-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2 text-2xl font-bold">
                <i class="fa-solid fa-map-location-dot text-amber-300"></i>
                <span>ដើរលេងកម្ពុជា (Explore KH)</span>
            </div>
            <div class="relative w-full md:w-96">
                <input type="text" id="searchInput" placeholder="ស្វែងរកឈ្មោះទីកន្លែង ឬខេត្ត..." 
                    class="w-full pl-10 pr-4 py-2 rounded-full text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-300 shadow-inner">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400"></i>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Category Filters -->
        <div class="flex flex-wrap gap-2 mb-6 justify-center" id="categoryButtons">
            <button onclick="filterCategory('ALL')" class="cat-btn active bg-teal-600 text-white px-4 py-2 rounded-full font-semibold shadow-sm transition">ទាំងអស់</button>
            <button onclick="filterCategory('រមណីយដ្ឋាន')" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🏝️ រមណីយដ្ឋាន</button>
            <button onclick="filterCategory('ប្រាសាទបុរាណ')" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🏛️ ប្រាសាទបុរាណ</button>
            <button onclick="filterCategory('កន្លែងកម្សាន្ត')" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🎡 កន្លែងកម្សាន្ត</button>
            <button onclick="filterCategory('ភោជនីយដ្ឋាន')" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🍽️ ភោជនីយដ្ឋាន</button>
        </div>

        <!-- Interactive Map Section -->
        <div class="bg-white p-3 rounded-2xl shadow-md mb-8 border border-slate-100">
            <div class="flex justify-between items-center mb-2 px-2">
                <h2 class="font-bold text-lg text-teal-700"><i class="fa-solid fa-location-crosshairs mr-1"></i> ផែនទីបង្ហាញទីតាំងផ្ទាល់</h2>
                <button onclick="resetMap()" class="text-sm text-teal-600 hover:underline font-semibold">មើលទូទាំងប្រទេស</button>
            </div>
            <div id="map"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="text-center py-12">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-teal-600"></i>
            <p class="mt-2 text-slate-500 font-semibold">កំពុងទាញយកទិន្នន័យទីកន្លែង...</p>
        </div>

        <!-- Places Grid -->
        <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- Modal Details -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-fade-in">
            <div class="relative">
                <img id="modalImg" src="" alt="" class="w-full h-60 object-cover">
                <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/50 text-white w-9 h-9 rounded-full hover:bg-black transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <span id="modalCategory" class="absolute bottom-3 left-3 bg-teal-600 text-white text-xs px-3 py-1 rounded-full font-semibold"></span>
            </div>
            <div class="p-6">
                <div class="flex justify-between items-start mb-2">
                    <h3 id="modalTitle" class="text-2xl font-bold text-slate-800"></h3>
                    <span id="modalProvince" class="text-sm bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg font-semibold"></span>
                </div>
                <p id="modalDesc" class="text-slate-600 text-sm leading-relaxed mb-5"></p>
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <a id="modalCallBtn" href="#" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-center py-2.5 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-phone"></i> <span id="modalPhoneText">ទំនាក់ទំនង</span>
                    </a>
                    <a id="modalMapBtn" href="#" target="_blank" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-center py-2.5 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-diamond-turn-right"></i> នាំផ្លូវ (Google Maps)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-300 text-center py-6 mt-12">
        <p>© 2026 ដើរលេងកម្ពុជា - បង្កើតឡើងដោយប្រើ Google Sheets + Apps Script + GitHub</p>
    </footer>

    <script>
        // ==========================================
        // ដាក់ WEB APP URL របស់អ្នកនៅត្រង់នេះ!
        const API_URL = "https://script.google.com/macros/s/AKfycbwXbTeBnsYVS1HmBir4q84q0q5mu_ewXLPGwz5cpwqPZqEPtKNCd31-AG9thT_XMsjrzw/exec"; 
        // ==========================================

        let allPlaces = [];
        let currentCategory = 'ALL';
        let markersLayer = L.layerGroup();

        // កំណត់ផែនទីដើមនៅប្រទេសកម្ពុជា
        const map = L.map('map').setView([12.5657, 104.9910], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        markersLayer.addTo(map);

        // ទាញទិន្នន័យពី Google Apps Script
        async function fetchPlaces() {
            try {
                const response = await fetch(API_URL);
                allPlaces = await response.json();
                document.getElementById('loader').style.display = 'none';
                renderData(allPlaces);
            } catch (error) {
                document.getElementById('loader').innerHTML = `<p class="text-red-500 font-bold">មានបញ្ហាក្នុងការទាញទិន្នន័យ! សូមពិនិត្យមើល API_URL របស់អ្នកឡើងវិញ។</p>`;
                console.error(error);
            }
        }

        // បង្ហាញ Card និង Pin លើផែនទី
        function renderData(places) {
            const grid = document.getElementById('placesGrid');
            grid.innerHTML = '';
            markersLayer.clearLayers();

            if (places.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">មិនមានទិន្នន័យទីកន្លែងដែលអ្នកស្វែងរកទេ។</p>`;
                return;
            }

            places.forEach(place => {
                const imgUrl = place.image || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80';
                const hasPhone = place.phone && place.phone.toString().trim() !== '' && place.phone !== 'N/A';
                
                // បង្កើត Card
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm hover:shadow-xl transition duration-300 overflow-hidden border border-slate-100 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative h-48 overflow-hidden cursor-pointer" onclick='openModal(${JSON.stringify(place).replace(/'/g, "&#39;")})'>
                            <img src="${imgUrl}" alt="${place.name}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                            <span class="absolute top-3 left-3 bg-teal-600/90 backdrop-blur-sm text-white text-xs px-3 py-1 rounded-full font-semibold">${place.category}</span>
                            <span class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded-lg"><i class="fa-solid fa-location-dot text-amber-400 mr-1"></i>${place.province}</span>
                        </div>
                        <div class="p-5">
                            <h3 class="text-xl font-bold text-slate-800 mb-2 line-clamp-1">${place.name}</h3>
                            <p class="text-slate-600 text-sm line-clamp-2 mb-4">${place.description}</p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                        <button onclick="focusOnMap(${place.lat}, ${place.lng})" class="text-teal-600 hover:bg-teal-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                            <i class="fa-solid fa-map-pin mr-1"></i> មើលលើផែនទី
                        </button>
                        <button onclick='openModal(${JSON.stringify(place).replace(/'/g, "&#39;")})' class="bg-slate-800 hover:bg-teal-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition">
                            ព័ត៌មានលម្អិត
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                // បន្ថែម Pin លើផែនទី
                if (place.lat && place.lng) {
                    const marker = L.marker([parseFloat(place.lat), parseFloat(place.lng)]);
                    marker.bindPopup(`
                        <div class="text-center font-sans">
                            <b class="text-teal-700 text-sm">${place.name}</b><br>
                            <span class="text-xs text-slate-500">${place.category} - ${place.province}</span><br>
                            ${hasPhone ? `<a href="tel:${place.phone}" class="text-xs text-emerald-600 font-bold block mt-1">📞 ${place.phone}</a>` : ''}
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" target="_blank" class="inline-block mt-2 bg-blue-600 text-white text-xs px-2 py-1 rounded">នាំផ្លូវទៅទីតាំង</a>
                        </div>
                    `);
                    markersLayer.addLayer(marker);
                }
            });
        }

        // មុខងារច្រោះតាមប្រភេទ (Filter)
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-teal-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-700');
            });
            event.target.classList.remove('bg-white', 'text-slate-700');
            event.target.classList.add('bg-teal-600', 'text-white');
            applyFilters();
        }

        // មុខងារស្វែងរក (Search)
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPlaces.filter(place => {
                const matchCat = currentCategory === 'ALL' || place.category === currentCategory;
                const matchSearch = place.name.toLowerCase().includes(keyword) || 
                                    place.province.toLowerCase().includes(keyword) ||
                                    place.description.toLowerCase().includes(keyword);
                return matchCat && matchSearch;
            });
            renderData(filtered);
        }

        // Zoom ផែនទីទៅកាន់ទីតាំងដែលចុច
        function focusOnMap(lat, lng) {
            if (!lat || !lng) return alert("ទីតាំងនេះមិនទាន់មានកូអរដោនេនៅឡើយទេ!");
            window.scrollTo({ top: 0, behavior: 'smooth' });
            map.flyTo([parseFloat(lat), parseFloat(lng)], 14);
        }

        function resetMap() {
            map.flyTo([12.5657, 104.9910], 7);
        }

        // បើកផ្ទាំងព័ត៌មានលម្អិត (Modal)
        function openModal(place) {
            document.getElementById('modalImg').src = place.image || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80';
            document.getElementById('modalCategory').innerText = place.category;
            document.getElementById('modalTitle').innerText = place.name;
            document.getElementById('modalProvince').innerText = place.province;
            document.getElementById('modalDesc').innerText = place.description;
            
            const callBtn = document.getElementById('modalCallBtn');
            if (place.phone && place.phone.toString().trim() !== '' && place.phone !== 'N/A') {
                callBtn.style.display = 'flex';
                callBtn.href = `tel:${place.phone}`;
                document.getElementById('modalPhoneText').innerText = place.phone;
            } else {
                callBtn.style.display = 'none'; // លាក់ប៊ូតុងទូរស័ព្ទបើជាប្រាសាទបុរាណដែលគ្មានលេខ
            }

            document.getElementById('modalMapBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;
            
            const modal = document.getElementById('detailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ចាប់ផ្តើមដំណើរការ
        fetchPlaces();
    </script>
</body>
</html>
