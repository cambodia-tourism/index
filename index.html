<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ដើរលេងកម្ពុជា</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        #map { height: 400px; width: 100%; border-radius: 1rem; z-index: 1; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-teal-600 to-emerald-600 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2 text-2xl font-bold">
                <i class="fa-solid fa-map-location-dot text-amber-300"></i>
                <span>ដើរលេងកម្ពុជា</span>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                <div class="relative w-full sm:w-72">
                    <input type="text" id="searchInput" placeholder="ស្វែងរកឈ្មោះទីកន្លែង ឬខេត្ត..." 
                        class="w-full pl-10 pr-4 py-2 rounded-full text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-300 text-sm">
                    <i class="fa-solid fa-search absolute left-3.5 top-2.5 text-slate-400"></i>
                </div>
                <button onclick="openAddModal()" class="w-full sm:w-auto bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-full shadow transition flex items-center justify-center gap-2 text-sm whitespace-nowrap">
                    <i class="fa-solid fa-plus-circle"></i> ចុះឈ្មោះទីតាំង
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Category Filters -->
        <div class="flex flex-wrap gap-2 mb-6 justify-center">
            <button onclick="filterCategory('ALL', this)" class="cat-btn bg-teal-600 text-white px-4 py-2 rounded-full font-semibold shadow-sm transition">ទាំងអស់</button>
            <button onclick="filterCategory('រមណីយដ្ឋាន', this)" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🏝️ រមណីយដ្ឋាន</button>
            <button onclick="filterCategory('ប្រាសាទបុរាណ', this)" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🏛️ ប្រាសាទបុរាណ</button>
            <button onclick="filterCategory('កន្លែងកម្សាន្ត', this)" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🎡 កន្លែងកម្សាន្ត</button>
            <button onclick="filterCategory('ភោជនីយដ្ឋាន', this)" class="cat-btn bg-white text-slate-700 hover:bg-teal-50 px-4 py-2 rounded-full font-semibold shadow-sm border transition">🍽️ ភោជនីយដ្ឋាន</button>
        </div>

        <!-- Interactive Map Section -->
        <div class="bg-white p-3 rounded-2xl shadow-md mb-8 border border-slate-100">
            <div class="flex justify-between items-center mb-2 px-2">
                <h2 class="font-bold text-lg text-teal-700"><i class="fa-solid fa-location-crosshairs mr-1"></i> ផែនទីបង្ហាញទីតាំងផ្ទាល់</h2>
                <button onclick="resetMap()" class="text-sm text-teal-600 hover:underline font-semibold">មើលទូទាំងប្រទេស</button>
            </div>
            <div id="map"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="text-center py-12">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-teal-600"></i>
            <p class="mt-2 text-slate-500 font-semibold">កំពុងទាញយកទិន្នន័យទីកន្លែង...</p>
        </div>

        <!-- Places Grid -->
        <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- Modal ព័ត៌មានលម្អិត -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl">
            <div class="relative">
                <img id="modalImg" src="" alt="" class="w-full h-60 object-cover">
                <button onclick="closeDetailModal()" class="absolute top-3 right-3 bg-black/50 text-white w-9 h-9 rounded-full hover:bg-black transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <span id="modalCategory" class="absolute bottom-3 left-3 bg-teal-600 text-white text-xs px-3 py-1 rounded-full font-semibold"></span>
            </div>
            <div class="p-6">
                <div class="flex justify-between items-start mb-2">
                    <h3 id="modalTitle" class="text-2xl font-bold text-slate-800"></h3>
                    <span id="modalProvince" class="text-sm bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg font-semibold"></span>
                </div>
                <p id="modalDesc" class="text-slate-600 text-sm leading-relaxed mb-5"></p>
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <a id="modalCallBtn" href="#" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-center py-2.5 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-phone"></i> <span id="modalPhoneText">ទំនាក់ទំនង</span>
                    </a>
                    <a id="modalMapBtn" href="#" target="_blank" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-center py-2.5 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-diamond-turn-right"></i> នាំផ្លូវ (Google Maps)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form ចុះឈ្មោះទីតាំងថ្មី -->
    <div id="addPlaceModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl my-8">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-xl font-bold text-teal-700"><i class="fa-solid fa-store mr-2"></i>ចុះឈ្មោះទីតាំង ឬសេវាកម្មថ្មី</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-700 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="addPlaceForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">ឈ្មោះទីកន្លែង *</label>
                    <input type="text" id="formName" required placeholder="ឧទាហរណ៍៖ ភោជនីយដ្ឋាន មាត់ទន្លេ" class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">ប្រភេទ *</label>
                        <select id="formCategory" required class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                            <option value="រមណីយដ្ឋាន">រមណីយដ្ឋាន</option>
                            <option value="ប្រាសាទបុរាណ">ប្រាសាទបុរាណ</option>
                            <option value="កន្លែងកម្សាន្ត">កន្លែងកម្សាន្ត</option>
                            <option value="ភោជនីយដ្ឋាន">ភោជនីយដ្ឋាន</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">រាជធានី / ខេត្ត *</label>
                        <input type="text" id="formProvince" required placeholder="ឧទាហរណ៍៖ សៀមរាប" class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">លេខទូរស័ព្ទទំនាក់ទំនង</label>
                        <input type="text" id="formPhone" placeholder="ឧទាហរណ៍៖ 012 345 678" class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Link រូបភាព (URL)</label>
                        <input type="url" id="formImage" placeholder="https://..." class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Latitude (រយៈទទឹង) *</label>
                        <input type="number" step="any" id="formLat" required placeholder="13.4125" class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Longitude (រយៈបណ្តោយ) *</label>
                        <input type="number" step="any" id="formLng" required placeholder="103.8670" class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>
                <p class="text-xs text-slate-500">💡 គន្លឹះ៖ ចូល Google Maps ហើយចុច Right-click លើទីតាំង ដើម្បី Copy លេខ Lat, Lng។</p>

                <div>
                    <label class="block text-sm font-semibold mb-1">ព័ត៌មានពិពណ៌នា *</label>
                    <textarea id="formDesc" rows="3" required placeholder="រៀបរាប់ពីសេវាកម្ម បរិយាកាស ឬម៉ោងបើក..." class="w-full border rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
                </div>

                <div id="formStatus" class="text-sm font-semibold hidden"></div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 rounded-xl border text-slate-600 hover:bg-slate-50 text-sm font-semibold">បោះបង់</button>
                    <button type="submit" id="submitBtn" class="px-6 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold shadow flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> បញ្ជូនទិន្នន័យ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-300 text-center py-6 mt-12">
        <p>© 2026 ដើរលេងកម្ពុជា - Google Sheets + Apps Script + GitHub</p>
    </footer>

    <script>
        // ដាក់ WEB APP URL របស់អ្នកនៅត្រង់នេះ
        const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQHLhBMddFHAf9fEQyniP-YzmAVB27dVPUM2bTm1jdgC109bERETJLqbxxIPEQl7e-5cHBcA5Jk_MB35uBEALkPWyCTqtb3xSk7E7xpr_omwmnGmwGGK2gZWfvoMwbwvaz9sLBCW9nXgqylO0KpRl0-C6B4exIIO1wGmEft7YgD4OzKRhhbO67oo_PEXOX7eVO2BOXdLGZ_0q9xX8kxXVLX3Eb6qt3y2p2e4XvOEtf3uCcwAKZx8yM0YxDs0Igni2uNh_X0Z9fHM3fhgPxbr1HFeYc05Q&lib=MdzbCN3BocEd6nk2CivRFL8Im34Dxge6l";

        let allPlaces = [];
        let currentCategory = 'ALL';
        let markersLayer = L.layerGroup();

        const map = L.map('map').setView([12.5657, 104.9910], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        markersLayer.addTo(map);

        async function fetchPlaces() {
            try {
                const response = await fetch(API_URL);
                allPlaces = await response.json();
                document.getElementById('loader').style.display = 'none';
                renderData(allPlaces);
            } catch (error) {
                document.getElementById('loader').innerHTML = `<p class="text-red-500 font-bold">មានបញ្ហាក្នុងការទាញទិន្នន័យ!</p>`;
                console.error(error);
            }
        }

        function renderData(places) {
            const grid = document.getElementById('placesGrid');
            grid.innerHTML = '';
            markersLayer.clearLayers();

            if (places.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">មិនមានទិន្នន័យទីកន្លែងដែលអ្នកស្វែងរកទេ។</p>`;
                return;
            }

            places.forEach(place => {
                const imgUrl = place.image || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80';
                const hasPhone = place.phone && place.phone.toString().trim() !== '' && place.phone !== 'N/A';
                const safePlace = JSON.stringify(place).replace(/'/g, "&#39;");

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm hover:shadow-xl transition duration-300 overflow-hidden border border-slate-100 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative h-48 overflow-hidden cursor-pointer" onclick='openDetailModal(${safePlace})'>
                            <img src="${imgUrl}" alt="${place.name}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                            <span class="absolute top-3 left-3 bg-teal-600/90 text-white text-xs px-3 py-1 rounded-full font-semibold">${place.category}</span>
                            <span class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded-lg"><i class="fa-solid fa-location-dot text-amber-400 mr-1"></i>${place.province}</span>
                        </div>
                        <div class="p-5">
                            <h3 class="text-xl font-bold text-slate-800 mb-2 line-clamp-1">${place.name}</h3>
                            <p class="text-slate-600 text-sm line-clamp-2">${place.description}</p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                        <button onclick="focusOnMap(${place.lat}, ${place.lng})" class="text-teal-600 hover:bg-teal-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                            <i class="fa-solid fa-map-pin mr-1"></i> មើលលើផែនទី
                        </button>
                        <button onclick='openDetailModal(${safePlace})' class="bg-slate-800 hover:bg-teal-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition">
                            ព័ត៌មានលម្អិត
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                if (place.lat && place.lng) {
                    const marker = L.marker([parseFloat(place.lat), parseFloat(place.lng)]);
                    marker.bindPopup(`
                        <div class="text-center font-sans">
                            <b class="text-teal-700 text-sm">${place.name}</b><br>
                            <span class="text-xs text-slate-500">${place.category} - ${place.province}</span><br>
                            ${hasPhone ? `<a href="tel:${place.phone}" class="text-xs text-emerald-600 font-bold block mt-1">📞 ${place.phone}</a>` : ''}
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" target="_blank" class="inline-block mt-2 bg-blue-600 text-white text-xs px-2 py-1 rounded">នាំផ្លូវទៅទីតាំង</a>
                        </div>
                    `);
                    markersLayer.addLayer(marker);
                }
            });
        }

        function filterCategory(category, btnEl) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-teal-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-700');
            });
            btnEl.classList.remove('bg-white', 'text-slate-700');
            btnEl.classList.add('bg-teal-600', 'text-white');
            applyFilters();
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPlaces.filter(place => {
                const matchCat = currentCategory === 'ALL' || place.category === currentCategory;
                const matchSearch = (place.name || '').toLowerCase().includes(keyword) || 
                                    (place.province || '').toLowerCase().includes(keyword) ||
                                    (place.description || '').toLowerCase().includes(keyword);
                return matchCat && matchSearch;
            });
            renderData(filtered);
        }

        function focusOnMap(lat, lng) {
            if (!lat || !lng) return alert("ទីតាំងនេះមិនទាន់មានកូអរដោនេនៅឡើយទេ!");
            window.scrollTo({ top: 0, behavior: 'smooth' });
            map.flyTo([parseFloat(lat), parseFloat(lng)], 14);
        }

        function resetMap() {
            map.flyTo([12.5657, 104.9910], 7);
        }

        function openDetailModal(place) {
            document.getElementById('modalImg').src = place.image || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80';
            document.getElementById('modalCategory').innerText = place.category;
            document.getElementById('modalTitle').innerText = place.name;
            document.getElementById('modalProvince').innerText = place.province;
            document.getElementById('modalDesc').innerText = place.description;
            
            const callBtn = document.getElementById('modalCallBtn');
            if (place.phone && place.phone.toString().trim() !== '' && place.phone !== 'N/A') {
                callBtn.style.display = 'flex';
                callBtn.href = `tel:${place.phone}`;
                document.getElementById('modalPhoneText').innerText = place.phone;
            } else {
                callBtn.style.display = 'none';
            }

            document.getElementById('modalMapBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;
            
            const modal = document.getElementById('detailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // បើក/បិទ Form ចុះឈ្មោះទីតាំង
        function openAddModal() {
            const modal = document.getElementById('addPlaceModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAddModal() {
            const modal = document.getElementById('addPlaceModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('formStatus').classList.add('hidden');
        }

        // បញ្ជូនទិន្នន័យពី Form ទៅ Google Apps Script
        document.getElementById('addPlaceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusEl = document.getElementById('formStatus');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> កំពុងរក្សាទុក...`;

            const payload = {
                name: document.getElementById('formName').value.trim(),
                category: document.getElementById('formCategory').value,
                province: document.getElementById('formProvince').value.trim(),
                phone: document.getElementById('formPhone').value.trim() || "N/A",
                image: document.getElementById('formImage').value.trim(),
                lat: document.getElementById('formLat').value.trim(),
                lng: document.getElementById('formLng').value.trim(),
                description: document.getElementById('formDesc').value.trim()
            };

            try {
                // ប្រើ mode: 'no-cors' ដើម្បីបញ្ជូនទៅ Google Apps Script ដោយគ្មានបញ្ហា CORS
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                statusEl.className = "text-sm font-semibold text-emerald-600 block";
                statusEl.innerText = "✅ បានរក្សាទុកទីតាំងជោគជ័យ! កំពុងធ្វើបច្ចុប្បន្នភាព...";
                document.getElementById('addPlaceForm').reset();

                // រង់ចាំ ១.៥ វិនាទី រួចទាញទិន្នន័យថ្មីមកបង្ហាញភ្លាម
                setTimeout(() => {
                    fetchPlaces();
                    closeAddModal();
                }, 1500);

            } catch (err) {
                statusEl.className = "text-sm font-semibold text-red-600 block";
                statusEl.innerText = "❌ មានបញ្ហាក្នុងការបញ្ជូនទិន្នន័យ!";
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> បញ្ជូនទិន្នន័យ`;
            }
        });

        fetchPlaces();
    </script>
</body>
</html>
